name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle'ı wrapper (gradlew) indirir; setup-gradle sadece önbellek içindir.
      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle (geçici ağ hatalarına karşı 3 deneme)
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleDebug --no-daemon; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "Deneme $n başarısız, 30 sn sonra tekrar..."
            sleep 30
          done

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: QuickShare-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Sürüme ekle (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
